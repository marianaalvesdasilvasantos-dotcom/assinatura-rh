<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assinatura RH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <img src="logo.png" alt="Logo UPA Del Castilho" class="logo">

        <h2>Assinatura Digital</h2>

        <label for="matricula">Matrícula</label>

        <input
            type="text"
            id="matricula"
            placeholder="Digite sua matrícula">

        <br><br>

        <label for="assinatura">Assine abaixo</label>

        <canvas id="assinatura"></canvas>

        <div class="declaracao">

            <input type="checkbox" id="aceite">

            <label for="aceite">
                Declaro que esta assinatura é de minha autoria e que as informações enviadas são verdadeiras.
            </label>

        </div>

        <div id="mensagem"></div>

        <div class="botoes">

            <button id="limpar" type="button">
                Limpar
            </button>

            <button id="enviar" type="button">
                Enviar
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
