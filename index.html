<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assinatura RH</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <img
            src="logo.png"
            alt="Logo UPA Del Castilho"
            class="logo"
        >

        <h2>Assinatura Digital</h2>


        <!-- ==============================
             MATRÍCULA
        =============================== -->

        <label for="matricula">
            Matrícula
        </label>

        <input
            type="text"
            id="matricula"
            placeholder="Digite sua matrícula"
            autocomplete="off"
        >


        <!-- ==============================
             TIPO DE DOCUMENTO
        =============================== -->

        <label for="tipoDocumento">
            Tipo de documento
        </label>

        <select id="tipoDocumento">

            <option value="">
                Selecione o documento
            </option>

            <option value="Vale Transporte">
                Vale Transporte
            </option>

            <option value="Plantão Extra">
                Plantão Extra
            </option>

        </select>


        <!-- ==============================
             ASSINATURA
        =============================== -->

        <label for="assinatura">
            Assine abaixo
        </label>

        <canvas id="assinatura"></canvas>


        <!-- ==============================
             DECLARAÇÃO
        =============================== -->

        <div class="declaracao">

            <input
                type="checkbox"
                id="aceite"
            >

            <label for="aceite">
                Declaro que esta assinatura é de minha autoria
                e que as informações enviadas são verdadeiras.
            </label>

        </div>


        <!-- ==============================
             MENSAGEM
        =============================== -->

        <div id="mensagem"></div>


        <!-- ==============================
             BOTÕES
        =============================== -->

        <div class="botoes">

            <button
                id="limpar"
                type="button"
            >
                Limpar
            </button>

            <button
                id="enviar"
                type="button"
            >
                Enviar
            </button>

        </div>

    </div>


    <!-- ==============================
         SIGNATURE PAD
    ============================== -->

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>


    <!-- ==============================
         NOSSO JAVASCRIPT
         v=5 evita cache antigo
    ============================== -->

    <script src="script.js?v=5"></script>

</body>

</html>
